 <!-- =========================================

<!-- =========================================
      SIGN IN FORM 
    ========================================= -->
<section class="auth-section">

    <div class="auth-card">

        <h1>Welcome Back</h1>

        <p>Sign in to continue to your Skills Track account.</p>

        <form id="loginForm">

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="primary-btn">
                Sign In
            </button>

        </form>

        <p class="auth-link">
            Not Registered? Press the link to create your account
            <a href="Registration.html">Create one here</a>
        </p>
     
          <p id="loginMessage"></p>
    </div>

</section>

  <script type="module" src="Java/Login.js"></script>

</body>
</html>
