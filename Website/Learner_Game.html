<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Code Word Scramble | Skills Track</title>

    <link rel="stylesheet" href="SRC/stylesheet.css">
</head>

<body>

    <div class="game-container">

        <a href="Learner_Dashboard.html" class="back-button">
            ← Back to Dashboard
        </a>

        <h1>Code Word Scramble </h1>

        <p class="game-description">
            Test your programming knowledge by unscrambling the words!
        </p>

        <div class="score-section">
            <p>Time: <span id="timer">60</span></p>
            <p>Score: <span id="score">0</span></p>
            <p>Word: <span id="wordNumber">1</span></p>
        </div>

        <div class="game-card">

            <h2 id="scrambledWord">NOITCNUF</h2>

            <p id="hint">
                Hint: A reusable block of code that performs a task.
            </p>

            <input
                type="text"
                id="answerInput"
                placeholder="Enter your answer"
                autocomplete="off"
            >

            <p id="feedback"></p>

            <button id="checkButton">Check Answer</button>

            <button id="nextButton" hidden>Next Word</button>

            <button id="restartButton" hidden>Play Again</button>

        </div>

<!-- RESULTS SCREEN -->
<div id="resultsScreen" hidden>
    <h2>🏆 Game Complete!</h2>

    <p id="resultMessage">Well done!</p>

    <div class="result-card">
        <p>Your Final Score</p>
        <h1><span id="finalScore">0</span> / 100</h1>
    </div>

    <p id="performanceMessage"></p>

    <button id="resultsPlayAgain">Play Again</button>

    <a href="Learner_Dashboard.html" class="back-button">
        Back to Dashboard
    </a>
</div>


    </div>


    <script src="Java/Learner_Game.js"></script>

</body>
</html>
